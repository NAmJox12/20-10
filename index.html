<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Gửi tới các bạn/chị phụ nữ Việt Nam 💖</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600&family=Be+Vietnam+Pro:wght@300;400;600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <!-- MÀN 1: thả tim đầy 100% -->
    <div id="fillStage">
      <p class="ft" id="fTitle">Trước khi mở quà...</p>
      <h2 class="fs" id="fSub">Hãy giúp trái tim này đầy lên nhé</h2>
      <div id="heartBox">
        <svg viewBox="-4 -4 108 98" aria-hidden="true">
          <defs>
            <clipPath id="clip">
              <path id="shape" d="M50 85 C10 55 0 35 0 22 C0 8 12 0 25 0 C36 0 45 6 50 14 C55 6 64 0 75 0 C88 0 100 8 100 22 C100 35 90 55 50 85Z" />
            </clipPath>
            <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff6fae" />
              <stop offset="1" stop-color="#ff1f70" />
            </linearGradient>
          </defs>
          <use href="#shape" fill="rgba(255,255,255,0.07)" />
          <g clip-path="url(#clip)">
            <g id="level" transform="translate(0 90)">
              <g id="wave">
                <path d="M0 4 Q12.5 -2 25 4 T50 4 T75 4 T100 4 T125 4 T150 4 T175 4 T200 4 V110 H0Z" fill="url(#grad)" />
              </g>
            </g>
          </g>
          <use href="#shape" fill="none" stroke="#ffb3d4" stroke-width="1.8" stroke-linejoin="round" />
        </svg>
        <div id="pct">0%</div>
      </div>
      <div id="bar"><i id="barFill"></i></div>
      <p id="fHint" class="pulse">Nhấn nút để thả thêm tình yêu 💗</p>
      <button class="fbtn" id="fillBtn">Thả tim 💗</button>
      <button class="fbtn" id="nextBtn">Mở thông điệp 💌</button>
    </div>

    <!-- MÀN 2: giải mã chữ -->
    <div id="stage" class="wait">
      <div class="line l1" id="l1"></div>
      <div class="line l2" id="l2"></div>
      <div id="hint">✦ Có một thông điệp đang bay lạc... ✦</div>
      <button id="btn">Giải mã 💌</button>
    </div>

    <!-- MÀN 3: thẻ chúc mừng -->
    <div id="card">
      <div class="box">
        <span class="badge">20 · 10 &nbsp;Ngày Phụ nữ Việt Nam</span>
        <div class="big">💖</div>
        <p class="t1">Gửi riêng cho</p>
        <h1 class="t2" id="name"></h1>
        <div class="orn">❀ ❤ ❀</div>
        <div id="msg"></div>
        <div class="wishes" id="wishes"></div>
        <div class="quote" id="quote"></div>
        <div class="sign" id="sign"></div>
        <div class="btns" id="btns">
          <small>nhấn phím Space để thả thêm tim ♡</small>
        </div>
      </div>
    </div>

    <div class="credit"><span>✦</span><b>Credit: Ân Phạm</b><span>✦</span></div>

    <script>
      /* ====== CẤU HÌNH ====== */
      const CFG = {
        l1: "CHÚC MỪNG 20/10",
        l2: "LEELEE",
        name: "Lee Lee",
        intro:
          "Nhân ngày 20/10, chúc Lee Lee luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸",
        wishes: [
          ["🌸", "Luôn xinh đẹp", "Rạng rỡ từ nụ cười đến trái tim."],
          ["💖", "Thật hạnh phúc", "Mỗi ngày đều có một niềm vui nhỏ."],
          ["✨", "Bình yên", "Nhẹ nhàng giữa mọi bộn bề."],
          ["🌹", "Được yêu thương", "Nhiều hơn bạn có thể đếm hết."],
        ],
        quote: "Cảm ơn bạn vì đã xuất hiện và làm thế giới này dịu dàng hơn rất nhiều.",
        sign: "— Một người luôn nghĩ đến bạn 🌹",
      };
      /* Cấu hình màn thả tim */
      const FILL = {
        step: [4, 8], // mỗi lần nhấn cộng ngẫu nhiên từ ... đến ...%
        decay: 0, // % tụt mỗi giây khi ngừng nhấn (0 = không tụt, thử 2 cho khó hơn)
        autoNext: false, // true = tự chuyển màn khi đầy 100%
        hints: [
          [0, "Nhấn nút để thả thêm tình yêu 💗"],
          [25, "Tốt lắm, tim đang ấm dần lên ✨"],
          [50, "Một nửa rồi, đừng dừng lại nhé 🌸"],
          [75, "Sắp đầy rồi, cố lên một chút nữa 💖"],
          [95, "Chỉ còn một chút xíu thôi... 🌹"],
        ],
      };

      const POOL = "ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789";
      const rnd = (a) =>
        Array.isArray(a) || typeof a === "string" ? a[Math.floor(Math.random() * a.length)] : 0;
      const R = (a, b) => Math.random() * (b - a) + a;
      const $ = (id) => document.getElementById(id);
      const HEARTS = ["❤", "💖", "💗", "💕", "💘", "🌸", "🌹", "💝"];
      let phase = "fill"; // fill -> main

      for (let i = 0; i < 60; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.cssText = `left:${R(0, 100)}vw;top:${R(0, 100)}vh;animation-delay:${R(0, 3)}s`;
        document.body.appendChild(s);
      }

      $("name").textContent = CFG.name;
      $("sign").textContent = CFG.sign;
      $("quote").textContent = CFG.quote;
      $("wishes").innerHTML = CFG.wishes
        .map((w) => `<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`)
        .join("");

      /* ================= MÀN 1: THẢ TIM ================= */
      let pct = 0,
        filled = false;
      function renderFill() {
        $("level").setAttribute("transform", `translate(0 ${90 - 94 * (pct / 100)})`);
        $("pct").textContent = Math.round(pct) + "%";
        $("barFill").style.width = pct + "%";
        const h = FILL.hints.filter((x) => pct >= x[0]).pop();
        if (h && !filled) $("fHint").textContent = h[1];
      }
      function press() {
        if (filled) return;
        pct = Math.min(100, pct + R(FILL.step[0], FILL.step[1]));
        renderFill();
        const box = $("heartBox");
        box.classList.remove("hb");
        void box.offsetWidth;
        box.classList.add("hb");
        const r = box.getBoundingClientRect();
        for (let i = 0; i < 3; i++) burst(r.left + r.width / 2, r.top + r.height / 2, rnd(HEARTS), 14);
        heart();
        if (pct >= 100) finishFill();
      }
      function finishFill() {
        filled = true;
        pct = 100;
        renderFill();
        $("heartBox").classList.add("full");
        $("fHint").classList.remove("pulse");
        $("fTitle").textContent = "Trái tim đã đầy 100%";
        $("fSub").textContent = "Giờ thì thông điệp đã sẵn sàng 💌";
        $("fHint").textContent = "Đầy ắp yêu thương rồi đó 💖";
        $("fillBtn").style.display = "none";
        $("nextBtn").classList.add("show");
        heartStorm();
        if (FILL.autoNext) setTimeout(startMain, 3000);
      }
      function startMain() {
        if (phase !== "fill") return;
        phase = "main";
        $("fillStage").classList.add("out");
        $("stage").classList.remove("wait");
        setTimeout(() => $("fillStage").remove(), 1000);
        (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(init);
      }
      $("fillBtn").onclick = press;
      $("nextBtn").onclick = startMain;
      if (FILL.decay > 0)
        setInterval(() => {
          if (phase === "fill" && !filled && pct > 0) {
            pct = Math.max(0, pct - FILL.decay / 5);
            renderFill();
          }
        }, 200);
      renderFill();

      /* ================= MÀN 2: GIẢI MÃ CHỮ ================= */
      const flyers = [];
      let W = innerWidth,
        H = innerHeight,
        decoding = false,
        landed = 0,
        total = 0;
      function build(el, text, cls) {
        [...text].forEach((c) => {
          const s = document.createElement("span");
          s.className = "slot" + (c === " " ? " sp" : "");
          s.textContent = c === " " ? "\u00a0" : c;
          el.appendChild(s);
          if (c !== " ") flyers.push({ slot: s, c, cls, real: true });
        });
      }
      build($("l1"), CFG.l1, "l1");
      build($("l2"), CFG.l2, "l2");
      total = flyers.length;

      function init() {
        flyers.forEach((f) => mk(f, parseFloat(getComputedStyle(f.slot).fontSize)));
        for (let i = 0; i < 34; i++) {
          const f = { real: false, c: "", cls: "" };
          flyers.push(f);
          mk(f, R(18, 56));
        }
        requestAnimationFrame(tick);
      }
      function mk(f, size) {
        const e = document.createElement("div");
        e.className = "fly";
        e.style.fontSize = size + "px";
        e.style.opacity = f.real ? 1 : 0.55;
        e.style.color = rnd(["#ffb3d4", "#ff6fae", "#ffd9a8", "#e0b3ff", "#fff"]);
        e.textContent = rnd(POOL);
        document.body.appendChild(e);
        Object.assign(f, {
          el: e, x: R(0, W), y: R(0, H), vx: R(-2.6, 2.6), vy: R(-2.6, 2.6),
          rot: R(0, 360), vr: R(-4, 4), t: R(0, 6), sc: 1, state: "fly",
        });
      }
      function tick() {
        flyers.forEach((f) => {
          if (f.state === "done" || !f.el) return;
          if (f.state === "fly") {
            f.vx += R(-0.12, 0.12);
            f.vy += R(-0.12, 0.12);
            const m = Math.hypot(f.vx, f.vy), mx = 3.2;
            if (m > mx) { f.vx *= mx / m; f.vy *= mx / m; }
            f.x += f.vx;
            f.y += f.vy;
            f.rot += f.vr;
            f.t += 0.04;
            f.sc = 1 + Math.sin(f.t) * 0.35;
            if (f.x < 0 || f.x > W) f.vx *= -1;
            if (f.y < 0 || f.y > H) f.vy *= -1;
            f.x = Math.max(-10, Math.min(W + 10, f.x));
            f.y = Math.max(-10, Math.min(H + 10, f.y));
          } else {
            const k = 0.075;
            f.x += (f.tx - f.x) * k;
            f.y += (f.ty - f.y) * k;
            f.rot += (0 - f.rot) * k;
            f.sc += (1 - f.sc) * k;
            if (Math.hypot(f.tx - f.x, f.ty - f.y) < 1.2 && Math.abs(f.rot) < 1) land(f);
          }
          f.el.style.transform = `translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
        });
        requestAnimationFrame(tick);
      }
      function land(f) {
        f.state = "done";
        f.el.remove();
        f.slot.classList.add("ok");
        sparkle(f.slot);
        if (++landed === total) {
          $("hint").textContent = "Giải mã thành công 💖";
          heartStorm();
          setTimeout(showCard, 1800);
        }
      }
      setInterval(
        () =>
          flyers.forEach((f) => {
            if (f.el && f.state !== "done" && Math.random() < 0.4) f.el.textContent = rnd(POOL);
          }),
        150,
      );

      function decode() {
        if (decoding || phase !== "main") return;
        decoding = true;
        $("btn").style.display = "none";
        $("hint").textContent = "Các chữ cái đang tìm về nhau... ✨";
        let i = 0;
        flyers.forEach((f) => {
          if (f.real) {
            setTimeout(() => {
              const r = f.slot.getBoundingClientRect();
              f.tx = r.left + r.width / 2;
              f.ty = r.top + r.height / 2;
              f.rot = (((f.rot % 360) + 540) % 360) - 180;
              f.state = "go";
              f.el.textContent = f.c;
            }, 600 + i++ * 160);
          } else {
            setTimeout(() => { f.el.style.opacity = 0; }, 500 + R(0, 1500));
            setTimeout(() => { f.state = "done"; f.el.remove(); }, 2600);
          }
        });
      }
      $("btn").onclick = decode;
      $("stage").addEventListener("click", (e) => {
        if (e.target.id !== "btn") decode();
      });
      addEventListener("resize", () => {
        W = innerWidth;
        H = innerHeight;
      });

      /* ================= HIỆU ỨNG CHUNG ================= */
      function sparkle(el) {
        const r = el.getBoundingClientRect();
        for (let i = 0; i < 4; i++) burst(r.left + r.width / 2, r.top + r.height / 2, "✦", 10);
      }
      function burst(x, y, ch, size) {
        const b = document.createElement("div");
        b.className = "burst";
        b.textContent = ch;
        b.style.cssText += `left:${x}px;top:${y}px;font-size:${size + R(0, 10)}px;color:#ffc2dc;--bx:${R(-70, 70)}px;--by:${R(-70, 70)}px`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 900);
      }
      function heart() {
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = rnd(HEARTS);
        const d = R(5, 11);
        h.style.cssText += `left:${R(0, 100)}vw;font-size:${R(16, 44)}px;animation-duration:${d}s;--dx:${R(-80, 80)}px;--rot:${R(-40, 40)}deg;opacity:${R(0.6, 1)}`;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000);
      }
      function heartStorm() {
        for (let i = 0; i < 40; i++) setTimeout(heart, i * 60);
      }

      /* ================= MÀN 3: THẺ ================= */
      function showCard() {
        $("stage").classList.add("hide");
        $("card").classList.add("show");
        setInterval(heart, 280);
        heartStorm();
        let i = 0;
        setTimeout(function type() {
          $("msg").textContent = CFG.intro.slice(0, ++i);
          if (i < CFG.intro.length) setTimeout(type, 40);
          else {
            document.querySelectorAll(".w").forEach((w, k) => setTimeout(() => w.classList.add("on"), k * 350));
            setTimeout(() => $("quote").classList.add("on2"), 1700);
            setTimeout(() => $("sign").classList.add("on2"), 2500);
            setTimeout(() => ($("btns").style.opacity = 1), 3000);
          }
        }, 1200);
      }

      /* Phím Space: màn 1 = thả tim / sang màn 2, màn 2 = giải mã / thả thêm tim */
      addEventListener("keydown", (e) => {
        if (e.code !== "Space") return;
        e.preventDefault();
        if (phase === "fill") return filled ? startMain() : press();
        if (!decoding) decode();
        else heartStorm();
      });

      /* Con trỏ trái tim */
      const cur = document.createElement("div");
      cur.id = "cur";
      cur.innerHTML = "<span>❤</span>";
      document.body.appendChild(cur);
      let lt = 0;
      addEventListener("pointermove", (e) => {
        cur.style.transform = `translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
        cur.style.opacity = 1;
        const n = performance.now();
        if (n - lt < 50) return;
        lt = n;
        const t = document.createElement("div");
        t.className = "trail";
        t.textContent = rnd(["❤", "💖", "💗", "💕"]);
        t.style.cssText += `left:${e.clientX}px;top:${e.clientY}px;font-size:${R(10, 20)}px;--tx:${R(-30, 30)}px`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1100);
      });
      document.addEventListener("mouseleave", () => (cur.style.opacity = 0));
      $("card").addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON") {
          for (let i = 0; i < 6; i++) burst(e.clientX, e.clientY, rnd(HEARTS), 18);
        }
      });
    </script>
  </body>
</html>
